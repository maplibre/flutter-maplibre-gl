group 'org.maplibre.maplibregl'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.4.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Read from the app's android/gradle.properties (or -P on the command line).
def useGooglePlayServicesLocation =
        project.findProperty('maplibre_gl.playServicesLocation')?.toString()?.trim() != 'false'

// MapLibre's rendering backend, from maplibre_gl.renderer in the same place: OpenGL ES by default,
// the most proven one on older GPUs; vulkan for Vulkan only, which Google Play then requires of
// the device; auto for both, picked at runtime, at about 10 MB more (#915).
def mapLibreRenderer =
        project.findProperty('maplibre_gl.renderer')?.toString()?.trim()?.toLowerCase() ?: 'opengl'
if (!(mapLibreRenderer in ['opengl', 'vulkan', 'auto'])) {
    throw new GradleException(
            "maplibre_gl.renderer=$mapLibreRenderer is not supported: use opengl, vulkan or auto")
}

// Who compiles our Kotlin depends on the app: from AGP 9 the Android Gradle plugin does, but
// only where built-in Kotlin is on, and the Flutter template turns it off (#905, #1008, #1018).
// Flutter 3.44 and later then apply KGP for us, though not always before this script runs. So
// apply it only when no Kotlin extension exists yet. pluginManager is the same call as
// `apply plugin:` at runtime, but Flutter's warning about KGP-applying plugins is a regex over
// this file that matches only the `apply plugin:` form, so writing it this way keeps the package
// out of a warning that is wrong wherever this branch does not run, and leaves Flutter's own
// fallback free to apply KGP first.
if (project.extensions.findByName('kotlin') == null) {
    project.pluginManager.apply('kotlin-android')
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'org.maplibre.maplibregl'
    }
    compileSdkVersion 36
    buildToolsVersion "36.0.0"

    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdkVersion 23
        compileSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        main {
            if (useGooglePlayServicesLocation) {
                java.srcDir 'src/gms/java'
            }
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    configurations.all {
        // android-sdk is the Vulkan build under another name: keep it out, so it can never sit
        // next to the artifact picked below and clash with its classes.
        exclude group: 'org.maplibre.gl', module: 'android-sdk'
    }
    dependencies {
        // One literal line per artifact, so that Dependabot and scripts/lib/generate.dart can
        // read the version. Keep the three versions equal.
        if (mapLibreRenderer == 'vulkan') {
            implementation 'org.maplibre.gl:android-sdk-vulkan:13.7.1'
        } else if (mapLibreRenderer == 'auto') {
            implementation 'org.maplibre.gl:android-sdk-vulkan-opengl:13.7.1'
        } else {
            implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'
        }
        implementation 'com.squareup.okhttp3:okhttp:5.4.0'
        // Google Play Services location gives high accuracy the fused provider. FOSS builds, such
        // as F-Droid, set maplibre_gl.playServicesLocation=false in the app's gradle.properties:
        // then nothing from Google is downloaded or compiled, and high accuracy uses the platform
        // LocationManager (#1014).
        if (useGooglePlayServicesLocation) {
            implementation 'com.google.android.gms:play-services-base:18.10.1'
            implementation 'com.google.android.gms:play-services-location:21.4.0'
        }
    }
}

// Set through the Kotlin extension rather than android.kotlinOptions, which AGP 9 removes. The
// extension is there whichever way Kotlin arrived: AGP registered it, Flutter applied KGP before
// this script ran, or the block above applied KGP because neither had.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    testImplementation 'junit:junit:4.13.2'
}
