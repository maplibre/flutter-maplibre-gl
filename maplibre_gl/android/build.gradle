group 'org.maplibre.maplibregl'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.4.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Who compiles our Kotlin depends on the app: from AGP 9 the Android Gradle plugin does, but
// only where built-in Kotlin is on, and the Flutter template turns it off (#905, #1008, #1018).
// Flutter 3.44 and later then apply KGP for us, though not always before this script runs. So
// apply it only when no Kotlin extension exists yet, through pluginManager, which keeps Flutter's
// scan for KGP-applying plugins from naming the package.
if (project.extensions.findByName('kotlin') == null) {
    project.pluginManager.apply('kotlin-android')
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'org.maplibre.maplibregl'
    }
    compileSdkVersion 36
    buildToolsVersion "36.0.0"

    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdkVersion 21
        compileSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    configurations.all {
        // Exclude the regular (Vulkan) SDK to avoid duplicate classes with the OpenGL variant
        // If we want to use the Vulkan-based renderer in the future, we can remove this exclusion and switch to the regular SDK dependency below.
        exclude group: 'org.maplibre.gl', module: 'android-sdk'
    }
    dependencies {
        // Using OpenGL instead of new Vulkan-based renderer for now, as it is more stable and has better performance on older devices.
        // If we want to use the Vulkan-based renderer in the future, we can switch to the regular SDK dependency below and remove the exclusion above.
        implementation 'org.maplibre.gl:android-sdk-opengl:13.5.0'
        implementation 'com.squareup.okhttp3:okhttp:5.4.0'
        implementation 'com.google.android.gms:play-services-base:18.10.0'
        implementation 'com.google.android.gms:play-services-location:21.4.0'
    }
}

// Set through the Kotlin extension rather than android.kotlinOptions, which AGP 9
// removes. The extension is there either way: AGP registered it, or the block above
// applied KGP because AGP had not.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
}
