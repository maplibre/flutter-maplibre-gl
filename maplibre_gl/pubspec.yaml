name: maplibre_gl
description: "Native MapLibre maps for Flutter: Mapbox Vector Tile (MVT) and PMTiles sources, custom styles, GeoJSON layers and offline regions on Android, iOS and Web."
version: 0.28.0
repository: https://github.com/maplibre/flutter-maplibre-gl
issue_tracker: https://github.com/maplibre/flutter-maplibre-gl/issues
documentation: https://maplibre.org/flutter-maplibre-gl/
funding:
  - https://github.com/sponsors/maplibre
  - https://opencollective.com/maplibre
screenshots:
  - description: "The same 3D map of Lower Manhattan on web, Android and iOS. Buildings are coloured by height with a data-driven expression."
    path: screenshots/platforms.webp
  - description: "Globe projection with atmosphere, set with setProjection and setSky. Web only."
    path: screenshots/globe.webp
  - description: "Earthquakes from a GeoJSON source drawn as a heatmap layer, weighted by magnitude."
    path: screenshots/heatmap.webp
  - description: "Clustered GeoJSON points with counts. Tapping a cluster zooms in to where it splits, via getClusterExpansionZoom."
    path: screenshots/cluster.webp
  - description: "Symbol annotations with a custom icon and labels, added with addSymbol and tappable through onSymbolTapped."
    path: screenshots/annotations.webp
topics:
  - map
  - maplibre
  - vector-tiles
  - openstreetmap
  - gis
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: '>=3.44.0'

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  maplibre_gl_platform_interface: ^0.28.0
  maplibre_gl_web: ^0.28.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: 29.1.0
  very_good_analysis: ^10.2.0

flutter:
  plugin:
    platforms:
      android:
        package: org.maplibre.maplibregl
        pluginClass: MapLibreMapsPlugin
        dartPluginClass: MapLibreNativePlugin
      ios:
        pluginClass: MapLibreMapsPlugin
        dartPluginClass: MapLibreNativePlugin
      web:
        default_package: maplibre_gl_web

platforms:
  android:
  ios:
  web:
