include: ../analysis_options.yaml

linter:
  rules:
    # As in maplibre_gl: on 0.x every release reads as a breaking version to
    # this rule, which would forbid the deprecated aliases kept for a rename.
    remove_deprecations_in_breaking_versions: false
analyzer:
  errors:
    unintended_html_in_doc_comment: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
