name: Flutter CI

on: [push, pull_request, workflow_dispatch]

# Cancel superseded runs to save CI minutes — but NOT on main: a main run
# also publishes the Pages deploy, and cancelling it mid-publish would leave
# the site half-deployed. So cancel-in-progress is true everywhere except
# refs/heads/main, where runs are allowed to finish (and deploys serialize via
# the deploy-pages job's own concurrency group).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default: only the deploy-pages job elevates to
# pages:write / id-token:write (via its own job-level permissions block).
permissions:
  contents: read

jobs:
  # Detect which parts of the repo changed so we only run the relevant jobs.
  # `code` => Dart/native/CI sources: needs the Dart checks.
  # `android`, `ios`, `web` => what a platform builds and tests: the shared
  #   Dart and CI sources plus that platform's own code. A web-only PR skips
  #   the Android and iOS jobs, and so on.
  # `docs` => anything that changes the rendered site: needs the docs build.
  #
  # Pushes to main and release branches, and manual runs, run every platform:
  # a merged PR is checked on all of them, and so is a toolchain that moved.
  #
  # The doc examples (maplibre_gl_example/lib/examples/docs/**) intentionally
  # belong to BOTH: they are real Dart that must compile/lint/build (code) AND
  # they are embedded as live iframes on the site (docs). They live under
  # maplibre_gl_example/** so the `code` globs below already cover them.
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      android: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.android == 'true' }}
      ios: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.ios == 'true' }}
      web: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.web == 'true' }}
      docs: ${{ steps.filter.outputs.docs }}
      gradle: ${{ steps.filter.outputs.gradle }}
    steps:
      - uses: actions/checkout@v6
      - name: Run every platform on main, release branches and manual runs
        id: scope
        run: echo "all=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))) }}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The web-only integration tests (*_web_test.dart) run on web alone;
          # every other test also runs on Android and iOS, through all_tests.dart.
          filters: |
            shared: &shared
              - 'maplibre_gl/lib/**'
              - 'maplibre_gl/pigeons/**'
              - 'maplibre_gl/pubspec.yaml'
              - 'maplibre_gl_platform_interface/lib/**'
              - 'maplibre_gl_platform_interface/pubspec.yaml'
              # Every platform resolves it, through maplibre_gl's dependencies.
              - 'maplibre_gl_web/pubspec.yaml'
              - 'maplibre_gl_example/lib/**'
              - 'maplibre_gl_example/assets/**'
              - 'maplibre_gl_example/pubspec.yaml'
              - 'pubspec.yaml'
              - '.github/workflows/**'
            android:
              - *shared
              - 'maplibre_gl/android/**'
              - 'maplibre_gl_example/android/**'
              - 'maplibre_gl_example/integration_test/!(*_web_test).dart'
              - 'maplibre_gl_example/integration_test/support/**'
            ios:
              - *shared
              - 'maplibre_gl/ios/**'
              - 'maplibre_gl_example/ios/**'
              - 'maplibre_gl_example/integration_test/!(*_web_test).dart'
              - 'maplibre_gl_example/integration_test/support/**'
            web:
              - *shared
              - 'maplibre_gl_web/**'
              - 'maplibre_gl_example/web/**'
              - 'maplibre_gl_example/integration_test/**'
              - 'maplibre_gl_example/test_driver/**'
            code:
              - 'maplibre_gl/**'
              - 'maplibre_gl_platform_interface/**'
              - 'maplibre_gl_web/**'
              - 'maplibre_gl_example/**'
              - 'scripts/**'
              - 'pubspec.yaml'
              - '.github/workflows/**'
              - '.github/gradle-compat/**'
            docs:
              - 'website/**'
              - 'maplibre_gl_example/lib/examples/docs/**'
              - '.github/workflows/**'
            # What the Gradle compat check configures: nothing else changes its result.
            gradle:
              - 'maplibre_gl/android/*.gradle'
              - 'maplibre_gl/android/gradle.properties'
              - '.github/gradle-compat/**'
              - '.github/workflows/flutter_ci.yml'

  dart-checks:
    name: "Dart checks"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_dart_checks.yml
    with:
      upload-coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-web:
    name: "Run web tests"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
      - run: melos run test:web --no-select

  # Integration tests drive a real map, so they reach the Java, Swift and
  # JavaScript code the unit tests only see through a mocked channel. Every
  # test builds its map from an inline style, so no job needs the network.
  integration-web:
    name: "Integration tests (web)"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maplibre_gl_example
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
      # The runner image ships a chromedriver that matches its Chrome.
      - name: Start chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
      # all_tests.dart runs every file in one app, so the suite builds once.
      # The web-only tests import package:web and run apart.
      - name: Run integration tests
        run: |
          status=0
          for target in all_tests.dart manual_location_web_test.dart \
              feature_drag_web_test.dart web_map_dom_test.dart \
              attribution_web_test.dart my_location_style_web_test.dart; do
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="integration_test/$target" \
              -d web-server --browser-name=chrome --headless || status=1
          done
          # Headless Chrome has a device pixel ratio of 1, where an asset icon
          # always uses its main file. At 2 it must pick the 2.0x variant.
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/add_image_size_test.dart \
            -d web-server --browser-name=chrome --headless \
            --web-browser-flag=--force-device-scale-factor=2 || status=1
          exit $status

  integration-android:
    name: "Integration tests (Android emulator)"
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: maplibre_gl_example
          script: flutter test integration_test/all_tests.dart -d emulator-5554

  build-android:
    name: "Build Android apk"
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      platform: android

  # Who compiles the Android module's Kotlin depends on the app: AGP itself, the Kotlin Gradle
  # Plugin the module applies, or Flutter's fallback. The example app pins one AGP version, so it
  # exercises exactly one of those, and 0.27.0 shipped a combination where none of them did
  # (#1008, #1018). This configures the module standalone across the combinations and asserts
  # which side ends up owning the compilation. Configuration only: seconds per leg, no Flutter SDK,
  # so the legs share one runner, and the job runs only when a file it configures changes.
  # See .github/gradle-compat/README.md.
  android-gradle-compat:
    name: "Android Gradle compat"
    needs: changes
    if: needs.changes.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      # Gradle 9.6 removed an internal API AGP 8 relies on, so AGP 8 pairs with 9.5 at the latest.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'
      - name: AGP 8.13.2, built-in Kotlin none
        working-directory: .github/gradle-compat
        run: >
          gradle :maplibre_gl:help
          -PagpVersion=8.13.2 -PkgpVersion=2.4.21 -PexpectKotlinOwner=kgp
      # What the Flutter template and its migrator write from 3.44 on, and the versions from #1018.
      - name: AGP 9.0.1, built-in Kotlin off
        if: ${{ !cancelled() }}
        working-directory: .github/gradle-compat
        run: >
          gradle :maplibre_gl:help
          -PagpVersion=9.0.1 -PkgpVersion=2.3.20 -PexpectKotlinOwner=kgp
          -Pandroid.builtInKotlin=false -Pandroid.newDsl=false
      # AGP 9 out of the box, compiling Kotlin itself.
      - name: AGP 9.3.1, built-in Kotlin default
        if: ${{ !cancelled() }}
        working-directory: .github/gradle-compat
        run: >
          gradle :maplibre_gl:help
          -PagpVersion=9.3.1 -PkgpVersion=2.4.21 -PexpectKotlinOwner=agp
      # The AGP, Gradle and Kotlin versions of the example app.
      - uses: gradle/actions/setup-gradle@v5
        if: ${{ !cancelled() }}
        with:
          gradle-version: '9.8.1'
      - name: AGP 9.4.1, built-in Kotlin off
        if: ${{ !cancelled() }}
        working-directory: .github/gradle-compat
        run: >
          gradle :maplibre_gl:help
          -PagpVersion=9.4.1 -PkgpVersion=2.4.21 -PexpectKotlinOwner=kgp
          -Pandroid.builtInKotlin=false -Pandroid.newDsl=false
      # Each maplibre_gl.renderer value resolves its MapLibre Android artifact, which the example
      # app, built with the default, never checks; and a typo fails instead of falling back (#915).
      - name: Renderer property
        if: ${{ !cancelled() }}
        working-directory: .github/gradle-compat
        run: |
          args="-PagpVersion=9.4.1 -PkgpVersion=2.4.21 -Pandroid.builtInKotlin=false -Pandroid.newDsl=false"
          for pair in opengl:android-sdk-opengl vulkan:android-sdk-vulkan auto:android-sdk-vulkan-opengl; do
            renderer=${pair%%:*} artifact=${pair#*:}
            out=$(gradle :maplibre_gl:dependencies --configuration releaseRuntimeClasspath $args -Pmaplibre_gl.renderer=$renderer)
            if ! grep -q "org.maplibre.gl:$artifact:" <<< "$out" || grep -q FAILED <<< "$out"; then
              echo "$out"
              echo "::error::maplibre_gl.renderer=$renderer did not resolve $artifact"
              exit 1
            fi
          done
          if gradle :maplibre_gl:help $args -Pmaplibre_gl.renderer=metal; then
            echo "::error::an unknown maplibre_gl.renderer did not fail the build"
            exit 1
          fi

  # Also the iOS build check: a simulator build is a debug build, the same one
  # these tests compile, so a separate build job would only spend a second
  # macOS runner.
  integration-ios:
    name: "Integration tests (iOS simulator)"
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
      # The newest iPhone on the newest iOS runtime the runner image ships.
      - name: Boot a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS"))]
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
            | last.value | map(select(.name | startswith("iPhone"))) | last.udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        working-directory: maplibre_gl_example
        run: flutter test integration_test/all_tests.dart -d ${{ steps.simulator.outputs.udid }}

  # On main, build web in release mode and upload it so the docs deploy can
  # reuse it (no second web build). On PRs/other branches, a plain web build:
  # the only release (dart2js) web compile a PR sees, since integration-web
  # runs a debug build.
  # Also runs for docs-only changes on main, because the Pages bundle needs a
  # fresh web demo to ship alongside the rebuilt docs.
  build-web:
    name: "Build web"
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      platform: web
      web-release: ${{ github.ref == 'refs/heads/main' }}

  # Build the MkDocs site and assemble the Pages bundle (web demo + docs).
  # Runs only on main after the relevant jobs succeed, and reuses the web
  # artifact from build-web instead of rebuilding the Flutter web app.
  build-docs:
    name: "Build docs + assemble Pages bundle"
    needs: [changes, build-web, dart-checks, test-web]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true') &&
      needs.build-web.result == 'success' &&
      (needs.dart-checks.result == 'success' || needs.dart-checks.result == 'skipped') &&
      (needs.test-web.result == 'success' || needs.test-web.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download web demo artifact
        uses: actions/download-artifact@v8
        with:
          name: web-demo
          path: web-demo

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r website/requirements.txt

      - name: Build MkDocs site
        working-directory: website
        run: mkdocs build

      # Pages bundle layout: the docs site is the root homepage, and the
      # Flutter web demo is served under /demo/ (built with that base-href).
      - name: Assemble Pages bundle (docs at root + demo under /demo)
        run: |
          mkdir -p pages
          cp -r website/site/. pages/
          mkdir -p pages/demo
          cp -r web-demo/. pages/demo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy-pages:
    name: "Deploy to GitHub Pages"
    needs: build-docs
    if: needs.build-docs.result == 'success'
    runs-on: ubuntu-latest
    # Only this job needs the elevated Pages scopes (top-level is contents:read).
    permissions:
      pages: write
      id-token: write
    # Serialize deploys instead of cancelling: cancel-in-progress:false means a
    # rapid second push to main QUEUES behind an in-flight deploy rather than
    # aborting it mid-publish. This never tears down the Pages environment — it
    # only controls whether an overlapping run waits or is cancelled. Combined
    # with the workflow-level cancel being disabled on main, a main deploy
    # always runs to completion; back-to-back pushes just queue in order.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # The one check branch protection should require. The jobs above skip whole
  # platforms, and the "caller / job" check of a skipped reusable workflow may
  # never report, leaving a required check waiting forever. This job reports
  # for all of them: skipped passes, failed or cancelled fails.
  ci-result:
    name: "CI result"
    if: always()
    needs: [changes, dart-checks, test-web, integration-web, integration-android, build-android, android-gradle-compat, integration-ios, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
